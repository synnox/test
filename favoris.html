<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css?v=20260919">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">
      <span class="dot"></span>
      <span>Sn <span class="badge">Streaming</span></span>
    </a>
    <div class="nav-links">
      <a href="index.html">Accueil</a>
      <a href="index.html?filter=Films">Films</a>
      <a href="favoris.html" class="active">Ma Liste</a>
      <a href="historique.html">Historique</a>
      <a href="parametres.html">Paramètres</a>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Changer de thème" title="Basculer thème">
      <svg class="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      <svg class="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <a class="nav-user-btn" id="navUser" href="parametres.html" title="Mon compte"></a>
    <div class="burger" id="burger" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></div>
  </nav>

  <header class="legal-head">
    <h1>Ma Liste</h1>
    <p id="favNote"></p>
  </header>

  <div class="legal-page">
    <a class="btn btn-ghost btn-sm legal-back" href="index.html">&larr; Retour à l'accueil</a>
    <div class="grid" id="favGrid"></div>
  </div>

  <footer>
    <div class="footer-inner">
      <div class="footer-brand">
        <div class="logo"><span class="dot"></span><span>Sn <span class="badge">Streaming</span></span></div>
        <p class="footer-tag">Streaming HD gratuit &bull; Films et séries à la demande</p>
      </div>
      <div class="footer-links">
        <a href="index.html">Accueil</a>
        <a href="favoris.html">Ma Liste</a>
        <a href="parametres.html">Paramètres</a>
        <a href="mentions-legales.html">Mentions légales</a>
      </div>
    </div>
    <p class="footer-note">Contenus de démonstration &mdash; sources dans <span>js/data.js</span>.</p>
  </footer>

  <script src="js/data.js?v=20260919"></script>
  <script src="js/accounts.js?v=20260919"></script>
  <script src="js/app.js?v=20260919"></script>
  <script>
  (function(){
    const u = Accounts.currentUser();
    document.getElementById("favNote").textContent = u
      ? "Films ajoutés par " + u + " — retire un film en cliquant le cœur sur n'importe quelle carte."
      : "Films que tu as ajoutés (invité) — retire un film en cliquant le cœur.";
    const favIds = getFavorites().filter(id => CATALOG.some(i => i.id === id));
    if (!favIds.length) {
      document.getElementById("favGrid").innerHTML = '<div class="empty" style="width:100%"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><p>Aucun film dans ta liste.</p><a class="btn btn-primary" style="margin-top:14px" href="index.html">Découvrir le catalogue</a></div>';
      return;
    }
    renderGrid(favIds.map(id => CATALOG.find(i => i.id === id)), "favGrid", "Aucun film.");
  })();
  </script>
</body>
</html>
