<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Détail — Sn Streaming</title>
  <link rel="stylesheet" href="css/style.css?v=20260917">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">
      <span class="dot"></span>
      <span>Sn <span class="badge">Streaming</span></span>
    </a>
    <div class="nav-links">
      <a href="index.html">Accueil</a>
      <a href="index.html?filter=Films">Films</a>
      <a href="parametres.html">Paramètres</a>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Changer de thème" title="Basculer thème">
      <svg class="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      <svg class="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <a class="nav-user-btn" id="navUser" href="parametres.html" title="Mon compte"></a>
    <div class="burger" id="burger" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></div>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="text" id="searchInput" placeholder="Rechercher un film, une série…" autocomplete="off">
    </div>
  </nav>

  <div class="detail-hero" id="detailHero">
    <div class="hero-bg"></div>
    <div class="hero-glow"></div>
    <div class="detail-content" id="detailContent"></div>
  </div>

  <section class="player-wrap" id="playerWrap" style="display:none;">
    <div class="player-shell" id="playerShell">
      <video id="player" autoplay playsinline referrerpolicy="no-referrer"></video>
      <div class="player-cue" id="playerCue">
        <button class="cue-btn" id="cuePlay" aria-label="Lecture / pause">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="cue-spin" id="cueSpin"></div>
        <div class="cue-msg" id="cueMsg"></div>
      </div>
      <div class="p-controls" id="pControls">
        <div class="p-seek">
          <input type="range" id="pSeek" min="0" max="1000" value="0" step="1" aria-label="Position de lecture">
        </div>
        <div class="p-row">
          <div class="p-left">
            <button class="p-btn" id="pPlay" aria-label="Lecture / pause">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="p-btn p-ic" id="pBack" aria-label="Reculer de 10 secondes">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l3-3 3 3"/><path d="M6 6v8a4 4 0 0 0 4 4h1"/><path d="M14 6h3a4 4 0 0 1 4 4v2"/></svg>
            </button>
            <button class="p-btn p-ic" id="pFwd" aria-label="Avancer de 10 secondes">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 9l-3-3-3 3"/><path d="M18 6v8a4 4 0 0 1-4 4h-1"/><path d="M10 6H7a4 4 0 0 0-4 4v2"/></svg>
            </button>
            <span class="p-time"><b id="pCur">0:00</b><span class="p-sep">/</span><span id="pDur">0:00</span></span>
          </div>
          <div class="p-right">
            <div class="p-vol">
              <button class="p-btn" id="pMute" aria-label="Couper le son">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
              </button>
              <input type="range" id="pVol" min="0" max="100" value="100" aria-label="Volume">
            </div>
            <select class="p-rate" id="pRate" aria-label="Vitesse de lecture">
              <option value="0.5">0.5×</option>
              <option value="0.75">0.75×</option>
              <option value="1" selected>1×</option>
              <option value="1.25">1.25×</option>
              <option value="1.5">1.5×</option>
              <option value="2">2×</option>
            </select>
            <button class="p-btn p-ic" id="pFull" aria-label="Plein écran">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="player-bar">
      <div class="now"><span class="live"></span><span id="nowPlaying">Lecture…</span></div>
    </div>
  </section>

  <section class="episodes-section" id="episodesSection" style="display:none;"></section>

  <footer>
    <div class="footer-inner">
      <div class="footer-brand">
        <div class="logo"><span class="dot"></span><span>Sn <span class="badge">Streaming</span></span></div>
        <p class="footer-tag">Streaming HD gratuit &bull; Films et séries à la demande</p>
      </div>
      <div class="footer-links">
        <a href="index.html">Accueil</a>
        <a href="mentions-legales.html">Mentions légales</a>
      </div>
    </div>
    <p class="footer-note">Contenus de démonstration &mdash; sources dans <span>js/data.js</span>.</p>
  </footer>

  <script src="js/data.js?v=20260917"></script>
  <script src="js/accounts.js?v=20260917"></script>
  <script src="js/app.js?v=20260917"></script>
  <script src="js/player.js?v=20260917"></script>
  <script src="js/detail.js?v=20260917"></script>
</body>
</html>
