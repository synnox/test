<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){try{var m=localStorage.getItem("sn_theme");if(m==="light"||(m!=="dark"&&window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)){document.documentElement.setAttribute("data-theme","light");}}catch(e){}})();</script>
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Sn Streaming — Films et séries en streaming HD gratuit.">
  <title>Sn Streaming — Films & Séries en HD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260924">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#080c12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eef4ff" media="(prefers-color-scheme: light)">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">
      <span class="dot"></span>
      <span>Sn <span class="badge">Streaming</span></span>
    </a>
    <div class="nav-links" id="navLinks">
      <a href="#" class="active" data-filter="Tous">Accueil</a>
      <a href="#" data-filter="Films">Films</a>
      <a href="favoris.html">Ma Liste</a>
      <a href="historique.html">Historique</a>
      <a href="parametres.html">Paramètres</a>
    <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="text" id="searchInput" placeholder="Rechercher un film, une série…" autocomplete="off">
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Changer de thème" title="Basculer thème">
        <svg class="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <svg class="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <a class="nav-user-btn" id="navUser" href="parametres.html" title="Mon compte"></a>
    </div>
    <div class="burger" id="burger" role="button" tabindex="0" aria-label="Menu" aria-expanded="false" aria-controls="navLinks"><span></span><span></span><span></span></div>
  </nav>

  <header class="hero" id="hero">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-glow"></div>
    <div class="hero-content" id="heroContent"></div>
  </header>

  <main>
    <section class="section" id="continueSection" style="display:none;">
      <div class="section-head"><h2>Reprendre la lecture</h2></div>
      <div class="grid" id="continueRow"></div>
    </section>

    <section class="section" id="topSection" style="display:none;">
      <div class="section-head"><h2>🏆 Ton Top 10</h2></div>
      <div class="grid" id="topGrid"></div>
    </section>

    <section class="section">
      <div class="section-head"><h2>Parcourir par genre</h2></div>
      <div class="genre-row" id="genreRow"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2 id="catalogTitle">Catalogue</h2>
        <div class="filters" id="filters">
          <button class="chip active" data-filter="Tous">Tous</button>
          <button class="chip" data-filter="Films">Films</button>
          <button class="chip" data-filter="Action">Action</button>
          <button class="chip" data-filter="Science-Fiction">Science-Fiction</button>
          <button class="chip" data-filter="Drame">Drame</button>
          <button class="chip" data-filter="Comédie">Comédie</button>
          <button class="chip" data-filter="Horreur">Horreur</button>
          <button class="chip" data-filter="Anime">Anime</button>
        </div>
      </div>
      <div class="adv-search" id="advSearch">
        <input type="number" id="advYearMin" placeholder="Année min" min="1900" max="2030" title="Année minimum">
        <input type="number" id="advYearMax" placeholder="Année max" min="1900" max="2030" title="Année maximum">
        <select id="advRating" title="Note minimum">
          <option value="0">Note : toutes</option>
          <option value="6">6+</option>
          <option value="7">7+</option>
          <option value="8">8+</option>
          <option value="8.5">8.5+</option>
        </select>
        <button class="btn btn-ghost btn-sm" id="advReset" type="button">Réinitialiser</button>
      </div>
      <div class="toolbar">
        <label class="sort-box">Trier
          <select id="sortSel" title="Trier le catalogue">
            <option value="default">Par défaut</option>
            <option value="title">Titre (A→Z)</option>
            <option value="rating">Note</option>
            <option value="year">Année</option>
            <option value="duration">Durée</option>
          </select>
          <button class="sort-dir" id="sortDir" type="button" title="Inverser le sens">↓</button>
        </label>
        <button class="btn btn-ghost btn-sm" id="btnLucky" type="button">🎲 J'ai de la chance</button>
      </div>
      <div class="grid" id="catalogGrid"></div>
    </section>
  </main>

  <footer>
    <div class="footer-inner">
      <div class="footer-brand">
        <div class="logo"><span class="dot"></span><span>Sn <span class="badge">Streaming</span></span></div>
        <p class="footer-tag">Streaming HD gratuit &bull; Films et séries à la demande</p>
      </div>
      <div class="footer-links">
        <a href="index.html">Accueil</a>
        <a href="parametres.html">Paramètres</a>
        <a href="mentions-legales.html">Mentions légales</a>
      </div>
    </div>
    <p class="footer-note">Contenus de démonstration &mdash; sources dans <span>js/data.js</span>.</p>
  </footer>

  <script src="js/data.js?v=20260924"></script>
  <script src="js/accounts.js?v=20260924"></script>
  <script src="js/app.js?v=20260924"></script>
  <script src="js/home.js?v=20260924"></script>
</body>
</html>
