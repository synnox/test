  <script>
  (function(){
    const u = Accounts.currentUser();
    const entries = getFullHistory();
    document.getElementById("histNote").textContent = (u
      ? "Historique de " + u
      : "Historique invité") + " — " + entries.length + " film" + (entries.length > 1 ? "s" : "") + " vus ou en cours.";
    if (!entries.length) {
      document.getElementById("histGrid").innerHTML = '<div class="empty" style="width:100%"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg><p>Aucun film dans l\'historique.</p><a class="btn btn-primary" style="margin-top:14px" href="index.html">Commencer à regarder</a></div>';
      return;
    }
    renderGrid(entries.map(e => e.item), "histGrid", "");
  })();
  </script>
